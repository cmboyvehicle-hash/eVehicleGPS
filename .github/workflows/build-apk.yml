name: Build e-Vehicle GPS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # เครื่อง ubuntu ของ GitHub มี Android SDK ติดตั้งไว้แล้ว (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk eVehicleGPS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eVehicleGPS-apk
          path: eVehicleGPS.apk
